  <g fill="#ffffff" opacity="0.9">
    <rect x="96" y="182" width="86" height="26" rx="6"/><circle cx="112" cy="195" r="5" fill="#22d3ee"/>
    <rect x="96" y="214" width="86" height="26" rx="6"/><circle cx="112" cy="227" r="5" fill="#22d3ee"/>
    <rect x="404" y="182" width="86" height="26" rx="6"/><circle cx="420" cy="195" r="5" fill="#34d399"/>
    <rect x="404" y="214" width="86" height="26" rx="6"/><circle cx="420" cy="227" r="5" fill="#34d399"/>
  </g>
  <g stroke="#a5f3fc" stroke-width="3" fill="none" opacity="0.9">
    <path d="M182 195 C 210 195 224 172 244 164"/>
    <path d="M182 227 C 216 227 232 180 244 168"/>
    <path d="M404 195 C 376 195 360 172 340 164"/>
    <path d="M404 227 C 370 227 354 180 340 168"/>
