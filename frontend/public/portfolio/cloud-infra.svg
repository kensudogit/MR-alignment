<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="クラウド基盤設計・構築">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
