    <rect x="516" y="108" width="14" height="14" rx="3"/><rect x="538" y="108" width="14" height="14" rx="3"/>
  </g>


  <text x="40" y="300" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif"
