<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="AIエージェント">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="70" cy="60" r="110" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>
  <circle cx="600" cy="320" r="130" fill="#000000" opacity="0.10" filter="url(#soft)"/>


  <rect x="40" y="46" width="560" height="196" rx="16" fill="url(#glass)"/>
  <polyline points="70,208 140,176 210,190 280,132 350,150 420,96 490,116 560,72"
            fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fde68a">
    <circle cx="140" cy="176" r="7"/><circle cx="280" cy="132" r="7"/>
    <circle cx="420" cy="96" r="7"/><circle cx="560" cy="72" r="7"/>
  </g>
  <g transform="translate(300,150)">
    <rect x="-52" y="-52" width="104" height="88" rx="18" fill="#ffffff" opacity="0.95"/>
    <circle cx="-20" cy="-16" r="9" fill="#9d174d"/><circle cx="20" cy="-16" r="9" fill="#9d174d"/>
    <rect x="-24" y="8" width="48" height="8" rx="4" fill="#9d174d"/>
    <line x1="0" y1="-52" x2="0" y2="-70" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="-76" r="7" fill="#fbbf24"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <rect x="452" y="176" width="112" height="40" rx="20"/>
    <circle cx="476" cy="196" r="8" fill="#9d174d"/><circle cx="504" cy="196" r="8" fill="#9d174d"/><circle cx="532" cy="196" r="8" fill="#9d174d"/>
  </g>


  <text x="40" y="300" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif"
        font-size="30" font-weight="700" fill="#ffffff">AIエージェント</text>
  <text x="40" y="330" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif"
        font-size="17" fill="#ffffff" opacity="0.85">株価予測 / SNS運用自動化</text>
</svg>
