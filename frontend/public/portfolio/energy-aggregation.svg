<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="エネルギーリソース">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="70" cy="60" r="110" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>
  <circle cx="600" cy="320" r="130" fill="#000000" opacity="0.10" filter="url(#soft)"/>


  <rect x="40" y="46" width="560" height="196" rx="16" fill="url(#glass)"/>
  <g fill="none" stroke="#a7f3d0" stroke-width="3" opacity="0.9">
    <path d="M140 190 C 200 190 240 140 320 140"/>
    <path d="M320 140 C 400 140 440 190 500 190"/>
    <path d="M180 96 C 240 96 260 140 320 140"/>
    <path d="M320 140 C 380 140 400 96 460 96"/>
  </g>
  <circle cx="320" cy="140" r="34" fill="#fbbf24"/>
  <path d="M326 120 l-16 26 h12 l-6 22 18 -28 h-12 z" fill="#065f46"/>
  <g fill="#ffffff" opacity="0.95">
    <rect x="112" y="176" width="56" height="34" rx="4"/><rect x="118" y="182" width="18" height="10" fill="#15803d"/><rect x="144" y="182" width="18" height="10" fill="#15803d"/>
    <rect x="472" y="176" width="56" height="34" rx="4"/><rect x="478" y="182" width="18" height="10" fill="#15803d"/><rect x="504" y="182" width="18" height="10" fill="#15803d"/>
  </g>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="180" y1="96" x2="180" y2="66"/><line x1="180" y1="66" x2="156" y2="46"/>
    <line x1="180" y1="66" x2="204" y2="46"/><line x1="180" y1="66" x2="180" y2="40"/>
    <line x1="460" y1="96" x2="460" y2="66"/><line x1="460" y1="66" x2="436" y2="46"/>
    <line x1="460" y1="66" x2="484" y2="46"/><line x1="460" y1="66" x2="460" y2="40"/>
  </g>


  <text x="40" y="300" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif"
