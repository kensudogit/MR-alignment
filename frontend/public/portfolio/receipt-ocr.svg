<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="領収書 自動データ化">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="70" cy="60" r="110" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>
  <circle cx="600" cy="320" r="130" fill="#000000" opacity="0.10" filter="url(#soft)"/>


  <rect x="40" y="46" width="560" height="196" rx="16" fill="url(#glass)"/>
  <g transform="translate(90,64)">
    <path d="M0 0 h130 v150 l-16 -12 -16 12 -16 -12 -16 12 -16 -12 -16 12 -16 -12 -18 12 z" fill="#ffffff"/>
    <g fill="#94a3b8">
      <rect x="18" y="24" width="94" height="9" rx="4"/>
      <rect x="18" y="46" width="70" height="8" rx="4"/>
      <rect x="18" y="66" width="86" height="8" rx="4"/>
      <rect x="18" y="86" width="56" height="8" rx="4"/>
    </g>
    <rect x="18" y="112" width="94" height="12" rx="4" fill="#1d4ed8"/>
  </g>
  <g stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M244 144 h96"/><path d="M326 128 l16 16 -16 16"/>
  </g>
  <g transform="translate(374,64)">
    <rect width="176" height="150" rx="10" fill="#0f172a" opacity="0.85"/>
    <rect x="14" y="16" width="148" height="22" rx="4" fill="#38bdf8" opacity="0.35"/>
    <g fill="#e2e8f0">
      <rect x="14" y="52" width="60" height="9" rx="4"/><rect x="88" y="52" width="74" height="9" rx="4"/>
      <rect x="14" y="74" width="60" height="9" rx="4"/><rect x="88" y="74" width="74" height="9" rx="4"/>
      <rect x="14" y="96" width="60" height="9" rx="4"/><rect x="88" y="96" width="74" height="9" rx="4"/>
    </g>
    <rect x="14" y="120" width="148" height="14" rx="4" fill="#34d399"/>
  </g>


  <text x="40" y="300" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif"
        font-size="30" font-weight="700" fill="#ffffff">領収書 自動データ化</text>
  <text x="40" y="330" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif"
        font-size="17" fill="#ffffff" opacity="0.85">OCR → 会計ソフト連携</text>
</svg>
