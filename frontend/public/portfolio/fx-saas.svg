<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="SaaS対応FXツール">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="70" cy="60" r="110" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>
  <circle cx="600" cy="320" r="130" fill="#000000" opacity="0.10" filter="url(#soft)"/>


  <rect x="40" y="46" width="560" height="196" rx="16" fill="url(#glass)"/>
  <polyline points="70,210 130,180 190,196 250,140 310,158 370,104 430,124 490,80 550,96"
            fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#ffffff" stroke-width="3" opacity="0.95">
    <line x1="110" y1="150" x2="110" y2="214"/><rect x="102" y="164" width="16" height="36" fill="#34d399"/>
    <line x1="180" y1="140" x2="180" y2="206"/><rect x="172" y="152" width="16" height="42" fill="#f87171"/>
    <line x1="250" y1="112" x2="250" y2="188"/><rect x="242" y="126" width="16" height="46" fill="#34d399"/>
    <line x1="320" y1="122" x2="320" y2="196"/><rect x="312" y="140" width="16" height="38" fill="#f87171"/>
    <line x1="390" y1="86"  x2="390" y2="168"/><rect x="382" y="100" width="16" height="52" fill="#34d399"/>
    <line x1="460" y1="98"  x2="460" y2="176"/><rect x="452" y="112" width="16" height="46" fill="#34d399"/>
  </g>
  <text x="522" y="86" font-family="monospace" font-size="26" font-weight="700" fill="#fbbf24">USD/JPY</text>


  <text x="40" y="300" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif"
        font-size="30" font-weight="700" fill="#ffffff">SaaS対応FXツール</text>
  <text x="40" y="330" font-family="'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif"
        font-size="17" fill="#ffffff" opacity="0.85">Realtime FX Analytics</text>
</svg>
